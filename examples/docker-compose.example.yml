version: '3.8'

services:
  # Legacy OpenCart / WordPress service running on hardened PHP 7.4 FPM
  php:
    build:
      context: ..
      dockerfile: Dockerfile.hardened
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=legacy_store
    volumes:
      - ./src:/var/www/html
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
